      parameters:
        - in: path
          name: id
          required: true
          schema:
            maxLength: 256
            type: string
        - explode: false
          in: query
          name: files
          schema:
            type: boolean
        - explode: false
          in: query
          name: provider
          schema:
            type: boolean
        - in: header
          name: If-Match
          required: true
          schema:
            maxLength: 66
            minLength: 66
