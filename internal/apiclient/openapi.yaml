  /api/v1/torrent-submissions/{key}:
    get:
      description: "200 proves a prior local enqueue, even after deletion. 404 means no committed receipt is visible: an original request may still be running. Retry only the same immutable intent with the same key; never mint another key automatically."
      operationId: get-torrent-submission
      parameters:
        - description: Original UUIDv4 submission key
          in: path
          name: key
          required: true
          schema:
            description: Original UUIDv4 submission key
            maxLength: 38
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TorrentSubmission"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Reconcile an accepted torrent submission
      tags:
        - torrents
  /api/v1/torrents:
    get:
      operationId: list-torrents
      parameters:
        - explode: false
          in: query
          name: status
          schema:
            enum:
              - queued
              - adding
              - processing
              - waiting_selection
              - downloading
              - uploading
              - finished
              - completed
              - error
              - cancelled
            type: string
        - description: Account id or name
          explode: false
          in: query
          name: account
          schema:
            description: Account id or name
            type: string
        - explode: false
          in: query
          name: category
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Torrent"
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List torrents
      tags:
        - torrents
    post:
      description: "Optional Idempotency-Key identifies one immutable add intent (UUIDv4, bare or quoted). A committed replay returns 201 with the current torrent and X-Debrid-Submission-Replayed: true, without requeueing. Receipt and torrent commit atomically. Reuse with different payload/account/category/settings returns 422 and X-Debrid-Error-Code: idempotency_mismatch. A removed accepted torrent returns 409/submission_removed and is never recreated. Other active duplicates return 409/active_torrent plus X-Debrid-Existing-Torrent-ID. Existing unkeyed clients keep ordinary add semantics. Receipts persist across restart/deletion. GET torrent-submissions/{key} reconciles timeouts; 404 does not mean an original request has finished. This is local enqueue deduplication, not a guarantee of exactly-once provider execution."
      operationId: add-torrent
      parameters:
        - description: Optional fresh UUIDv4 (bare or quoted). Persist and reuse only with the identical submitted intent until reconciled.
          in: header
          name: Idempotency-Key
          schema:
            description: Optional fresh UUIDv4 (bare or quoted). Persist and reuse only with the identical submitted intent until reconciled.
            maxLength: 38
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddTorrentInBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Torrent"
          description: Created
          headers:
            X-Debrid-Submission-Replayed:
              schema:
                description: True when this key replays a prior accepted local enqueue
                type: boolean
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Add a torrent from a magnet link
      tags:
        - torrents
  /api/v1/torrents/file:
    post:
      description: "Optional Idempotency-Key identifies one immutable add intent (UUIDv4, bare or quoted). A committed replay returns 201 with the current torrent and X-Debrid-Submission-Replayed: true, without requeueing. Receipt and torrent commit atomically. Reuse with different payload/account/category/settings returns 422 and X-Debrid-Error-Code: idempotency_mismatch. A removed accepted torrent returns 409/submission_removed and is never recreated. Other active duplicates return 409/active_torrent plus X-Debrid-Existing-Torrent-ID. Existing unkeyed clients keep ordinary add semantics. Receipts persist across restart/deletion. GET torrent-submissions/{key} reconciles timeouts; 404 does not mean an original request has finished. This is local enqueue deduplication, not a guarantee of exactly-once provider execution."
      operationId: add-torrent-file
      parameters:
        - description: Optional fresh UUIDv4 (bare or quoted); same reconciliation contract as magnet adds
          in: header
          name: Idempotency-Key
          schema:
            description: Optional fresh UUIDv4 (bare or quoted); same reconciliation contract as magnet adds
            maxLength: 38
            type: string
      requestBody:
        content:
          multipart/form-data:
            encoding:
              account:
                contentType: text/plain
              category:
                contentType: text/plain
              file:
                contentType: application/x-bittorrent,application/octet-stream
              settings:
                contentType: text/plain
            schema:
              properties:
                account:
                  type: string
                category:
                  type: string
                file:
                  format: binary
                  type: string
                  x-contentEncoding: binary
                  x-contentMediaType: application/octet-stream
                settings:
                  description: Optional JSON TorrentSettings object, full replacement of defaults, not merged (16 KiB maximum)
                  maxLength: 16384
                  type: string
              required:
                - file
              type: object
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Torrent"
          description: Created
          headers:
            X-Debrid-Submission-Replayed:
              schema:
                description: True when this key replays a prior accepted local enqueue
                type: boolean
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Add a torrent from a .torrent file (multipart)
      tags:
        - torrents
  /api/v1/torrents/{id}:
