components:
  schemas:
    Account:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/Account.json
          format: uri
          readOnly: true
          type: string
        created_at:
          format: date-time
          type: string
        enabled:
          type: boolean
        id:
          description: Account id
          type: string
        is_default:
          description: Used when a torrent is added without an account
          type: boolean
        kind:
          description: Provider kind
          enum:
            - torbox
            - realdebrid
            - alldebrid
            - premiumize
            - debridlink
          type: string
        name:
          description: Display name (unique)
          type: string
        updated_at:
          format: date-time
          type: string
        user:
          $ref: "#/components/schemas/User"
          description: Live provider user info when available
      required:
        - id
        - kind
        - name
        - enabled
        - is_default
        - created_at
        - updated_at
      type: object
    AddAccountInBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/AddAccountInBody.json
          format: uri
          readOnly: true
          type: string
        credentials:
          $ref: "#/components/schemas/Credentials"
        kind:
          enum:
            - torbox
            - realdebrid
            - alldebrid
            - premiumize
            - debridlink
          type: string
        name:
          description: Display name; defaults to the kind
          type: string
        set_default:
          type: boolean
      required:
        - kind
        - credentials
      type: object
    AddTorrentInBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/AddTorrentInBody.json
          format: uri
          readOnly: true
          type: string
        account:
          description: Account id or name; default account when empty
          type: string
        category:
          type: string
        magnet:
          description: Magnet URI
          type: string
        settings:
          $ref: "#/components/schemas/TorrentSettings"
          description: Full per-torrent settings replacing the configured defaults (not merged)
      required:
        - magnet
      type: object
    AuthStatusOutBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/AuthStatusOutBody.json
          format: uri
          readOnly: true
          type: string
        configured:
          description: Whether onboarding has completed
          type: boolean
        mode:
          description: "Configured auth mode: password or oidc; empty until onboarding"
          type: string
        native_sso:
          description: Secure native SSO exchange is available for the configured OIDC identity
          type: boolean
        oidc_issuer:
          description: Configured OIDC issuer, shown on the login/setup screens
          type: string
      required:
        - configured
        - mode
        - native_sso
      type: object
    CancellationAcceptance:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/CancellationAcceptance.json
          format: uri
          readOnly: true
          type: string
        accepted_at:
          format: date-time
          type: string
        torrent_exists:
          type: boolean
        torrent_id:
          type: string
      required:
        - torrent_id
        - accepted_at
        - torrent_exists
      type: object
    CancellationReview:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/CancellationReview.json
          format: uri
          readOnly: true
          type: string
        allowed:
          type: boolean
        provider_may_continue:
          type: boolean
        revision:
          type: string
        torrent_id:
          type: string
      required:
        - torrent_id
        - revision
        - allowed
        - provider_may_continue
      type: object
    ChangePasswordInBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/ChangePasswordInBody.json
          format: uri
          readOnly: true
          type: string
        current_password:
          type: string
        new_password:
          maxLength: 512
          minLength: 10
          type: string
      required:
        - current_password
        - new_password
      type: object
    ConfirmFileSelectionInBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/ConfirmFileSelectionInBody.json
          format: uri
          readOnly: true
          type: string
        file_ids:
          items:
            type: string
          maxItems: 20000
          minItems: 1
          type: array
        revision:
          maxLength: 64
          minLength: 64
          pattern: ^[a-f0-9]{64}$
          type: string
      required:
        - revision
        - file_ids
      type: object
    Credentials:
      additionalProperties: false
      properties:
        api_key:
          description: API key / token for the provider
          type: string
      type: object
    Download:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/Download.json
          format: uri
          readOnly: true
          type: string
        bytes_done:
          format: int64
          type: integer
        completed_at:
          format: date-time
          type: string
        error:
          type: string
        file_id:
          type: string
        filename:
          type: string
        finished_at:
          format: date-time
          type: string
        id:
          type: string
        path:
          description: Path relative to the torrent directory
          type: string
        progress:
          description: 0..1
          format: double
          type: number
        queued_at:
          format: date-time
          type: string
        retry_count:
          format: int64
          type: integer
        size:
          format: int64
          type: integer
        started_at:
          format: date-time
          type: string
        state:
          enum:
            - pending
            - unrestricting
            - downloading
            - downloaded
            - unpacking
            - done
            - error
            - cancelled
          type: string
        torrent_id:
          type: string
      required:
        - id
        - torrent_id
        - path
        - filename
        - size
        - bytes_done
        - progress
        - state
        - retry_count
        - queued_at
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          example: Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          example: https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          example: 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          example: Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          example: https://example.com/errors/example
          format: uri
          type: string
      type: object
    EvAccountChanged:
      additionalProperties: false
      properties:
        account_id:
          type: string
        at:
          format: date-time
          type: string
        download_id:
          type: string
        torrent_id:
          type: string
        type:
          type: string
      required:
        - type
        - at
      type: object
    EvDownloadUpdated:
      additionalProperties: false
      properties:
        account_id:
          type: string
        at:
          format: date-time
          type: string
        download_id:
          type: string
        torrent_id:
          type: string
        type:
          type: string
      required:
        - type
        - at
      type: object
    EvSettingsChanged:
      additionalProperties: false
      properties:
        account_id:
          type: string
        at:
          format: date-time
          type: string
        download_id:
          type: string
        torrent_id:
          type: string
        type:
          type: string
      required:
        - type
        - at
      type: object
    EvTorrentAdded:
      additionalProperties: false
      properties:
        account_id:
          type: string
        at:
          format: date-time
          type: string
        download_id:
          type: string
        torrent_id:
          type: string
        type:
          type: string
      required:
        - type
        - at
      type: object
    EvTorrentDeleted:
      additionalProperties: false
      properties:
        account_id:
          type: string
        at:
          format: date-time
          type: string
        download_id:
          type: string
        torrent_id:
          type: string
        type:
          type: string
      required:
        - type
        - at
      type: object
    EvTorrentUpdated:
      additionalProperties: false
      properties:
        account_id:
          type: string
        at:
          format: date-time
          type: string
        download_id:
          type: string
        torrent_id:
          type: string
        type:
          type: string
      required:
        - type
        - at
      type: object
    File:
      additionalProperties: false
      properties:
        id:
          type: string
        path:
          type: string
        selected:
          type: boolean
        size:
          format: int64
          type: integer
      required:
        - id
        - path
        - size
        - selected
      type: object
    FileSelection:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/FileSelection.json
          format: uri
          readOnly: true
          type: string
        files:
          items:
            $ref: "#/components/schemas/File"
          type: array
        message:
          type: string
        provider_selects:
          type: boolean
        revision:
          type: string
        selected_ids:
          items:
            type: string
          type: array
        state:
          enum:
            - automatic
            - pending
            - ready
            - accepted
            - unavailable
          type: string
        torrent_id:
          type: string
      required:
        - torrent_id
        - state
        - files
        - selected_ids
        - provider_selects
        - message
      type: object
    HealthOutBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/HealthOutBody.json
          format: uri
          readOnly: true
          type: string
        capabilities:
          description: Additive feature identifiers; missing features must not be assumed
          items:
            type: string
          type: array
        ok:
          type: boolean
        version:
          type: string
      required:
        - ok
        - version
        - capabilities
      type: object
    Heartbeat:
      additionalProperties: false
      properties:
        at:
          format: date-time
          type: string
      required:
        - at
      type: object
    LoginInBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/LoginInBody.json
          format: uri
          readOnly: true
          type: string
        password:
          type: string
        username:
          type: string
      required:
        - username
        - password
      type: object
    MeOutBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/MeOutBody.json
          format: uri
          readOnly: true
          type: string
        api_key:
          description: True when authenticated with the API key
          type: boolean
        mode:
          type: string
        username:
          description: Set for session requests; empty for API-key requests
          type: string
      required:
        - mode
        - api_key
      type: object
    NativeExchangeInBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/NativeExchangeInBody.json
          format: uri
          readOnly: true
          type: string
        code:
          maxLength: 43
          minLength: 43
          pattern: ^[A-Za-z0-9_-]{43}$
          type: string
        verifier:
          maxLength: 128
          minLength: 43
          pattern: ^[A-Za-z0-9._~-]+$
          type: string
      required:
        - code
        - verifier
      type: object
    NativeExchangeOutBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/NativeExchangeOutBody.json
          format: uri
          readOnly: true
          type: string
        session_token:
          description: Server-bound session secret; store only in protected credential storage
          type: string
        username:
          type: string
      required:
        - session_token
        - username
      type: object
    NativeStartInBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/NativeStartInBody.json
          format: uri
          readOnly: true
          type: string
        challenge:
          description: S256 challenge for an app-owned PKCE verifier
          maxLength: 43
          minLength: 43
          pattern: ^[A-Za-z0-9_-]{43}$
          type: string
        state:
          description: App-generated random 32-byte base64url state
          maxLength: 43
          minLength: 43
          pattern: ^[A-Za-z0-9_-]{43}$
          type: string
      required:
        - challenge
        - state
      type: object
    NativeStartOutBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/NativeStartOutBody.json
          format: uri
          readOnly: true
          type: string
        authorization_url:
          type: string
      required:
        - authorization_url
      type: object
    OrganizeParsed:
      additionalProperties: false
      properties:
        codec:
          type: string
        episode:
          format: int64
          type: integer
        group:
          type: string
        resolution:
          type: string
        season:
          format: int64
          type: integer
        source:
          type: string
        title:
          type: string
        tv:
          type: boolean
        year:
          format: int64
          type: integer
      required:
        - title
      type: object
    OrganizePreviewInBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/OrganizePreviewInBody.json
          format: uri
          readOnly: true
          type: string
        movie_template:
          description: Override the saved movie template; explicit empty uses the built-in default
          type: string
        name:
          description: Release name to preview
          maxLength: 512
          minLength: 1
          type: string
        tv_template:
          description: Override the saved TV template; explicit empty uses the built-in default
          type: string
      required:
        - name
      type: object
    OrganizePreviewOutBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/OrganizePreviewOutBody.json
          format: uri
          readOnly: true
          type: string
        organized:
          description: False when the name would keep the raw-name folder
          type: boolean
        parsed:
          $ref: "#/components/schemas/OrganizeParsed"
          description: Release metadata when the name parsed
        path:
          description: Folder path the torrent would use (relative to the download dir / category)
          type: string
      required:
        - path
        - organized
      type: object
    OrganizeSettings:
      additionalProperties: false
      properties:
        enabled:
          description: Lay out new torrents as a media library (Movie Name (Year)/...)
          type: boolean
        movie_template:
          description: Movie path template; empty = '{title} ({year})'
          type: string
        tv_template:
          description: TV path template; empty = '{title} ({year})/Season {season:02}'
          type: string
      type: object
    RemovalReview:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/RemovalReview.json
          format: uri
          readOnly: true
          type: string
        exists:
          type: boolean
        provider_copy_known:
          type: boolean
        revision:
          type: string
        torrent_id:
          type: string
      required:
        - torrent_id
        - exists
        - provider_copy_known
      type: object
    RetryAcceptance:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/RetryAcceptance.json
          format: uri
          readOnly: true
          type: string
        accepted_at:
          format: date-time
          type: string
        kind:
          type: string
        resource_id:
          type: string
        torrent_exists:
          type: boolean
        torrent_id:
          type: string
      required:
        - kind
        - resource_id
        - torrent_id
        - accepted_at
        - torrent_exists
      type: object
    RetryRequestInBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/RetryRequestInBody.json
          format: uri
          readOnly: true
          type: string
        key:
          description: Fresh UUIDv4 persisted before POST; reuse only for this immutable retry intent
          maxLength: 38
          minLength: 36
          type: string
        revision:
          maxLength: 64
          minLength: 64
          pattern: ^[a-f0-9]{64}$
          type: string
      required:
        - key
        - revision
      type: object
    RetryReview:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/RetryReview.json
          format: uri
          readOnly: true
          type: string
        allowed:
          type: boolean
        kind:
          type: string
        resource_id:
          type: string
        revision:
          type: string
        torrent_id:
          type: string
        wait_for_selection:
          type: boolean
      required:
        - kind
        - resource_id
        - torrent_id
        - revision
        - allowed
        - wait_for_selection
      type: object
    SelectFilesInBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/SelectFilesInBody.json
          format: uri
          readOnly: true
          type: string
        file_ids:
          items:
            type: string
          minItems: 1
          type: array
      required:
        - file_ids
      type: object
    SessionOutBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/SessionOutBody.json
          format: uri
          readOnly: true
          type: string
        username:
          type: string
      required:
        - username
      type: object
    Settings:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/Settings.json
          format: uri
          readOnly: true
          type: string
        categories:
          items:
            type: string
          type: array
        organize:
          $ref: "#/components/schemas/OrganizeSettings"
        torrent_defaults:
          $ref: "#/components/schemas/TorrentSettings"
        unpack_max_depth:
          format: int64
          maximum: 5
          minimum: 0
          type: integer
      required:
        - torrent_defaults
      type: object
    SettingsReviewBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/SettingsReviewBody.json
          format: uri
          readOnly: true
          type: string
        revision:
          maxLength: 64
          minLength: 64
          pattern: ^[a-f0-9]{64}$
          type: string
        settings:
          $ref: "#/components/schemas/Settings"
      required:
        - settings
        - revision
      type: object
    SetupOIDCInBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/SetupOIDCInBody.json
          format: uri
          readOnly: true
          type: string
        client_id:
          type: string
        client_secret:
          description: Optional for public clients
          type: string
        issuer:
          description: OIDC issuer URL, e.g. https://id.example.com
          type: string
      required:
        - issuer
        - client_id
      type: object
    SetupOIDCOutBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/SetupOIDCOutBody.json
          format: uri
          readOnly: true
          type: string
        auth_url:
          description: Navigate the browser here to complete setup at the provider
          type: string
      required:
        - auth_url
      type: object
    SetupPasswordInBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/SetupPasswordInBody.json
          format: uri
          readOnly: true
          type: string
        password:
          maxLength: 512
          minLength: 10
          type: string
        username:
          maxLength: 64
          minLength: 2
          type: string
      required:
        - username
        - password
      type: object
    Status:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/Status.json
          format: uri
          readOnly: true
          type: string
        accounts:
          format: int64
          type: integer
        disk_free_bytes:
          format: int64
          type: integer
        disk_total_bytes:
          format: int64
          type: integer
        download_dir:
          type: string
        downloads:
          additionalProperties:
            format: int64
            type: integer
          description: Count by download state
          type: object
        torrents:
          additionalProperties:
            format: int64
            type: integer
          description: Count by torrent status
          type: object
        version:
          type: string
      required:
        - version
        - download_dir
        - accounts
        - torrents
        - downloads
        - disk_free_bytes
        - disk_total_bytes
      type: object
    Torrent:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/Torrent.json
          format: uri
          readOnly: true
          type: string
        account_id:
          type: string
        added_at:
          format: date-time
          type: string
        category:
          type: string
        completed_at:
          format: date-time
          type: string
        dir_name:
          description: Folder path under the download dir ('/'-separated); frozen when local downloads start
          type: string
        downloads:
          items:
            $ref: "#/components/schemas/Download"
          type: array
        error:
          type: string
        file_selection_state:
          description: Explicit NAS-download selection state, independent of provider lifecycle
          enum:
            - automatic
            - pending
            - accepted
          type: string
        files:
          items:
            $ref: "#/components/schemas/File"
          type: array
        hash:
          type: string
        id:
          type: string
        local_progress:
          description: 0..1 progress of local downloads
          format: double
          type: number
        name:
          type: string
        organized:
          description: True when dir_name was produced by library organization
          type: boolean
        provider_id:
          type: string
        provider_progress:
          description: 0..1 progress at the debrid provider
          format: double
          type: number
        provider_status:
          description: Raw provider status string
          type: string
        retry_count:
          format: int64
          type: integer
        seeders:
          format: int64
          type: integer
        settings:
          $ref: "#/components/schemas/TorrentSettings"
        size:
          format: int64
          type: integer
        speed:
          description: Provider-side bytes/sec
          format: int64
          type: integer
        status:
          enum:
            - queued
            - adding
            - processing
            - waiting_selection
            - downloading
            - uploading
            - finished
            - completed
            - error
            - cancelled
          type: string
        status_reason:
          description: Human-readable detail about the current state
          type: string
      required:
        - id
        - account_id
        - hash
        - name
        - status
        - provider_progress
        - local_progress
        - size
        - speed
        - seeders
        - file_selection_state
        - files
        - settings
        - retry_count
        - added_at
        - downloads
      type: object
    TorrentSettings:
      additionalProperties: false
      properties:
        delete_on_error:
          description: Remove the torrent (files, provider) this long after a terminal error, e.g. 24h; empty = never
          type: string
        download_retries:
          description: Automatic retries per file
          format: int64
          minimum: 0
          type: integer
        exclude_regex:
          description: Skip paths matching this (case-insensitive)
          type: string
        finished_action:
          description: What to do at the provider after local completion
          enum:
            - keep
            - remove_from_provider
          type: string
        finished_delay:
          description: Delay before finished_action, e.g. 10m (Go duration)
          type: string
        include_regex:
          description: Only download paths matching this (case-insensitive); overrides exclude
          type: string
        lifetime:
          description: Fail if not finished at the provider within this long, e.g. 72h; empty = never
          type: string
        manual_files:
          description: Download exactly these provider file ids
          items:
            type: string
          type: array
        min_file_size:
          description: Skip files smaller than this many bytes
          format: int64
          minimum: 0
          type: integer
        organize:
          description: Override the global library-organization toggle for this torrent (absent = inherit)
          type: boolean
        torrent_retries:
          description: Automatic re-adds after a provider error
          format: int64
          minimum: 0
          type: integer
        unpack:
          description: Extract archives after download
          type: boolean
        wait_for_selection:
          description: Hold NAS downloads for explicit provider-file review at add time; confirmed through the file-selection endpoint
          type: boolean
      type: object
    TorrentSubmission:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/TorrentSubmission.json
          format: uri
          readOnly: true
          type: string
        accepted_at:
          format: date-time
          type: string
        torrent_exists:
          description: False means it was removed; the original key must not recreate it
          type: boolean
        torrent_id:
          type: string
      required:
        - torrent_id
        - accepted_at
        - torrent_exists
      type: object
    UpdateAccountInBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/UpdateAccountInBody.json
          format: uri
          readOnly: true
          type: string
        credentials:
          $ref: "#/components/schemas/Credentials"
        enabled:
          type: boolean
        name:
          type: string
        set_default:
          type: boolean
      type: object
    UpdateTorrentInBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/UpdateTorrentInBody.json
          format: uri
          readOnly: true
          type: string
        category:
          type: string
        settings:
          $ref: "#/components/schemas/TorrentSettings"
          description: Full settings replacement except the preserved manual selection/hold; choose the hold at add time and confirm through file-selection
      type: object
    User:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/User.json
          format: uri
          readOnly: true
          type: string
        email:
          type: string
        expires_at:
          format: date-time
          type: string
        plan:
          type: string
        premium:
          type: boolean
        username:
          type: string
      required:
        - premium
      type: object
  securitySchemes:
    bearer:
      description: API key
      scheme: bearer
      type: http
info:
  description: Manage torrents on debrid providers and download their files locally.
  title: debrid-client API
  version: dev
openapi: 3.0.3
paths:
  /api/v1/accounts:
    get:
      operationId: list-accounts
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Account"
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List provider accounts
      tags:
        - accounts
    post:
      description: Credentials are verified against the provider before saving. The first account becomes the default.
      operationId: add-account
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAccountInBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Add a provider account
      tags:
        - accounts
  /api/v1/accounts/{id}:
    delete:
      operationId: delete-account
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: Also delete the account's torrents (locally)
          explode: false
          in: query
          name: force
          schema:
            description: Also delete the account's torrents (locally)
            type: boolean
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete an account
      tags:
        - accounts
    get:
      operationId: get-account
      parameters:
        - description: Account id or name
          in: path
          name: id
          required: true
          schema:
            description: Account id or name
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get an account
      tags:
        - accounts
    patch:
      operationId: update-account
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountInBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update an account
      tags:
        - accounts
  /api/v1/accounts/{id}/removal:
    delete:
      operationId: remove-account-with-drain
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: Also delete the account's torrents (locally)
          explode: false
          in: query
          name: force
          schema:
            description: Also delete the account's torrents (locally)
            type: boolean
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Remove an exact account with guarded local transfer drain
      tags:
        - accounts
  /api/v1/accounts/{id}/test:
    post:
      operationId: test-account
      parameters:
        - description: Account id or name
          in: path
          name: id
          required: true
          schema:
            description: Account id or name
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Verify an account against its provider
      tags:
        - accounts
  /api/v1/auth/login:
    post:
      operationId: auth-login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionOutBody"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Log in with username and password
      tags:
        - auth
  /api/v1/auth/logout:
    post:
      operationId: auth-logout
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Log out the current session
      tags:
        - auth
  /api/v1/auth/me:
    get:
      operationId: auth-me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeOutBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Current authentication identity
      tags:
        - auth
  /api/v1/auth/native/exchange:
    post:
      operationId: auth-native-exchange
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativeExchangeInBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NativeExchangeOutBody"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Exchange one-time native grant with its PKCE verifier
      tags:
        - auth
  /api/v1/auth/native/start:
    post:
      operationId: auth-native-start
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativeStartInBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NativeStartOutBody"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Start secure native Pocket ID sign-in
      tags:
        - auth
  /api/v1/auth/oidc/callback:
    get:
      operationId: auth-oidc-callback
      parameters:
        - explode: false
          in: query
          name: state
          schema:
            type: string
        - explode: false
          in: query
          name: code
          schema:
            type: string
        - explode: false
          in: query
          name: error
          schema:
            type: string
        - explode: false
          in: query
          name: error_description
          schema:
            type: string
      responses:
        "302":
          description: Found
          headers:
            Cache-Control:
              schema:
                type: string
            Location:
              schema:
                type: string
            Referrer-Policy:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: OIDC provider callback
      tags:
        - auth
  /api/v1/auth/oidc/start:
    get:
      operationId: auth-oidc-start
      responses:
        "302":
          description: Found
          headers:
            Location:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Redirect to the OIDC provider to sign in
      tags:
        - auth
  /api/v1/auth/password:
    post:
      operationId: auth-change-password
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Change the local user's password (revokes all sessions)
      tags:
        - auth
  /api/v1/auth/setup/oidc:
    post:
      operationId: auth-setup-oidc
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupOIDCInBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupOIDCOutBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: "First-run setup: configure OIDC and begin the pinning sign-in (requires the API key)"
      tags:
        - auth
  /api/v1/auth/setup/password:
    post:
      operationId: auth-setup-password
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupPasswordInBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionOutBody"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: "First-run setup: create the local user (requires the API key)"
      tags:
        - auth
  /api/v1/auth/status:
    get:
      operationId: auth-status
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatusOutBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Authentication status
      tags:
        - auth
  /api/v1/downloads/{id}/retry:
    post:
      operationId: retry-download
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Download"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Retry a failed download
      tags:
        - torrents
  /api/v1/downloads/{id}/retry-requests:
    post:
      operationId: request-download-retry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            maxLength: 256
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetryRequestInBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryAcceptance"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Accept one revision-checked durable retry request
      tags:
        - torrents
  /api/v1/downloads/{id}/retry-requests/{key}:
    get:
      operationId: get-download-retry-request
      parameters:
        - in: path
          name: id
          required: true
          schema:
            maxLength: 256
            type: string
        - in: path
          name: key
          required: true
          schema:
            maxLength: 38
            type: string
        - description: Original review revision bound to this request key
          explode: false
          in: query
          name: revision
          required: true
          schema:
            description: Original review revision bound to this request key
            maxLength: 64
            minLength: 64
            pattern: ^[a-f0-9]{64}$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryAcceptance"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Check a saved retry without repeating the mutation
      tags:
        - torrents
  /api/v1/downloads/{id}/retry-review:
    get:
      operationId: review-download-retry
      parameters:
        - description: Exact resource id returned by the API (not a prefix/hash alias)
          in: path
          name: id
          required: true
          schema:
            description: Exact resource id returned by the API (not a prefix/hash alias)
            maxLength: 256
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryReview"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Review retry eligibility and immutable revision
      tags:
        - torrents
  /api/v1/events:
    get:
      description: "Event names: torrent.added, torrent.updated, torrent.deleted, download.updated, account.changed, settings.changed, heartbeat (every 15s). Payloads are small notifications; re-fetch the resource. Slow consumers may miss events — re-sync on reconnect. Authenticate with the Bearer header or ?api_key= (EventSource cannot set headers)."
      operationId: events
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                description: Each oneOf object in the array represents one possible Server Sent Events (SSE) message, serialized as UTF-8 text according to the SSE specification.
                items:
                  oneOf:
                    - properties:
                        data:
                          $ref: "#/components/schemas/EvAccountChanged"
                        event:
                          const: account.changed
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          type: integer
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event account.changed
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/EvDownloadUpdated"
                        event:
                          const: download.updated
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          type: integer
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event download.updated
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/Heartbeat"
                        event:
                          const: heartbeat
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          type: integer
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event heartbeat
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/EvSettingsChanged"
                        event:
                          const: settings.changed
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          type: integer
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event settings.changed
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/EvTorrentAdded"
                        event:
                          const: torrent.added
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          type: integer
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event torrent.added
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/EvTorrentDeleted"
                        event:
                          const: torrent.deleted
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          type: integer
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event torrent.deleted
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/EvTorrentUpdated"
                        event:
                          const: torrent.updated
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          type: integer
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event torrent.updated
                      type: object
                title: Server Sent Events
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Stream change events (Server-Sent Events)
      tags:
        - system
  /api/v1/health:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOutBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security: []
      summary: Health check
      tags:
        - system
  /api/v1/organize/preview:
    post:
      operationId: organize-preview
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizePreviewInBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizePreviewOutBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Preview the organized folder for a release name
      tags:
        - settings
  /api/v1/settings:
    get:
      operationId: get-settings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get runtime settings
      tags:
        - settings
    put:
      operationId: update-settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Replace runtime settings
      tags:
        - settings
  /api/v1/settings/review:
    get:
      operationId: review-settings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsReviewBody"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Read runtime settings with an opaque write revision
      tags:
        - settings
    put:
      description: "Requires exactly one strong quoted If-Match.412 refuses stale state atomically, including changes through legacy clients and ABA changes. Missing/empty/weak/list/duplicate headers are rejected; no unconditional fallback. A lost response is not an acceptance receipt: read current settings and require fresh review, never automatically replay."
      operationId: update-reviewed-settings
      parameters:
        - in: header
          name: If-Match
          required: true
          schema:
            maxLength: 66
            minLength: 66
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
        required: true
      responses:
        "200":
          content:
