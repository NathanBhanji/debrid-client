  /api/v1/torrents/{id}/cancellation-requests:
    post:
      description: Persist key and original revision before POST. Replays return the original receipt even after retry/removal. Acceptance means local workers drained and stopped state committed; provider activity may continue. Completed/error races return conflict without replacing the terminal result.
      operationId: request-torrent-cancellation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            maxLength: 256
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetryRequestInBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancellationAcceptance"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Accept one durable local cancellation
      tags:
        - torrents
  /api/v1/torrents/{id}/cancellation-requests/{key}:
    get:
      description: 404 means no committed receipt is visible, not proof an original request failed. Retry only the same immutable intent/key. A receipt remains accepted after later retry or removal and does not claim the transfer is currently stopped.
      operationId: get-torrent-cancellation-request
      parameters:
        - in: path
          name: id
          required: true
          schema:
            maxLength: 256
            type: string
        - in: path
          name: key
          required: true
          schema:
            maxLength: 38
            type: string
        - description: Original review revision bound to this request key
          explode: false
          in: query
          name: revision
          required: true
          schema:
            description: Original review revision bound to this request key
            maxLength: 64
            minLength: 64
            pattern: ^[a-f0-9]{64}$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancellationAcceptance"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Reconcile a saved cancellation without repeating it
      tags:
        - torrents
  /api/v1/torrents/{id}/cancellation-review:
    get:
      description: Stops local orchestration and NAS work without removing records or files. Remote provider activity may continue. Revision binds the retry incarnation, not changing progress.
