services:
  debrid:
    image: ghcr.io/nathanbhanji/debrid-client:latest
    container_name: debrid
    restart: unless-stopped
    # Optional: run as your own uid/gid so downloaded files are owned by you.
    # If you set this, create ./data and your downloads dir FIRST (owned by that
    # uid) — otherwise Docker creates them as root and the server can't write.
    # user: "1000:1000"
    ports:
      - "8080:8080"
    environment:
      # Leave unset to auto-generate a key on first start (printed in the logs,
      # persisted in /data), or set it explicitly, e.g. via a .env file:
      DEBRID_SERVER__API_KEY: ${DEBRID_SERVER__API_KEY:-}
      DEBRID_ENGINE__DOWNLOAD_LIMIT: "3"
      DEBRID_LOG__FORMAT: json
    volumes:
      - debrid-data:/data
      - /path/to/downloads:/downloads

volumes:
  debrid-data:
