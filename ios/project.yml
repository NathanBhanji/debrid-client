name: Debrid
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    iOS: '27.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: ZTN995BU9H
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY[sdk=iphoneos*]: Apple Distribution
targets:
  Debrid:
    type: application
    platform: iOS
    sources:
      - path: Debrid
        excludes: [Info.plist]
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: DebridKit
      - target: DebridShare
        embed: true
    info:
      path: Debrid/Info.plist
      properties:
        CFBundleDisplayName: Debrid
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        DebridKeychainAccessGroup: $(AppIdentifierPrefix)dev.bhanji.debrid
        CFBundleURLTypes:
          - CFBundleURLName: dev.bhanji.debrid.auth
            CFBundleURLSchemes: [dev.bhanji.debrid]
          - CFBundleURLName: dev.bhanji.debrid.magnet
            CFBundleTypeRole: Editor
            CFBundleURLSchemes: [magnet]
        CFBundleDocumentTypes:
          - CFBundleTypeName: BitTorrent metadata
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.bittorrent.torrent]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.bittorrent.torrent
            UTTypeDescription: BitTorrent metadata
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [torrent]
              public.mime-type: [application/x-bittorrent]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: false
        DebridSourceRevision: $(DEBRID_SOURCE_REVISION)
    entitlements:
      path: Debrid/Debrid.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.bhanji.debrid
        keychain-access-groups:
          - $(AppIdentifierPrefix)dev.bhanji.debrid
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bhanji.debrid
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: Debrid AppStore AppGroup
  DebridShare:
    type: app-extension
    platform: iOS
    sources:
      - path: DebridShare
        excludes: [Info.plist]
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Debrid/DesignSystem.swift
      - path: Debrid/Assets.xcassets
    dependencies:
      - target: DebridKit
        embed: false
    info:
      path: DebridShare/Info.plist
      properties:
        CFBundleDisplayName: Debrid
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 16
              NSExtensionActivationSupportsFileWithMaxCount: 16
    entitlements:
      path: DebridShare/DebridShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.bhanji.debrid
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bhanji.debrid.share
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks", "@executable_path/../../Frameworks"]
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: Debrid Share AppStore AppGroup
  DebridKit:
    type: framework
    platform: iOS
    sources:
      - path: DebridKit
        excludes: [Info.plist]
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: DebridKit/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bhanji.debrid.kit
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  DebridKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DebridKitTests
        excludes: [Info.plist]
      - path: ../testdata/ios-api
        type: folder
        buildPhase: resources
    dependencies:
      - target: Debrid
      - target: DebridKit
    info:
      path: DebridKitTests/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bhanji.debrid.kit-tests
  DebridUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DebridUITests
        excludes: [Info.plist]
    dependencies:
      - target: Debrid
    info:
      path: DebridUITests/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bhanji.debrid.ui-tests
        TARGETED_DEVICE_FAMILY: '1'
schemes:
  Debrid:
    build:
      targets:
        Debrid: all
        DebridKitTests: [test]
        DebridUITests: [test]
    test:
      targets: [DebridKitTests, DebridUITests]
      gatherCoverageData: false
